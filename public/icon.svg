<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED59B" />
      <stop offset="50%" stop-color="#C7A56A" />
      <stop offset="100%" stop-color="#9A783E" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24211B" />
      <stop offset="100%" stop-color="#141310" />
    </linearGradient>
  </defs>
  <!-- Background Medallion -->
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="168" height="168" rx="34" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" fill="none" />
  <circle cx="90" cy="90" r="72" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6" fill="none" />
  
  <!-- Diamond Crown Motif -->
  <g transform="translate(90, 48)">
    <polygon points="0,-18 14,-6 8,14 -8,14 -14,-6" fill="url(#goldGrad)" />
    <polygon points="0,-18 7,-6 0,14 -7,-6" fill="#FFF2D6" opacity="0.6" />
    <circle cx="0" cy="-24" r="2.5" fill="#FFF5DC" />
    <circle cx="-16" cy="-10" r="1.5" fill="#FFF5DC" />
    <circle cx="16" cy="-10" r="1.5" fill="#FFF5DC" />
  </g>

  <!-- Elegant Monogram PJ -->
  <text x="90" y="128" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="64" 
        font-weight="600" 
        font-style="italic" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        letter-spacing="-2">PJ</text>

  <!-- Subtle bottom sparkle -->
  <g transform="translate(90, 148)" fill="url(#goldGrad)">
    <polygon points="0,-4 1.5,0 0,4 -1.5,0" />
    <polygon points="-4,0 0,1.5 4,0 0,-1.5" />
  </g>
</svg>